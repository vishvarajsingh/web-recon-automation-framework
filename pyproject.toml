[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-recon-automation-framework"
version = "1.1.0"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "cryptography>=42.0.0",
    "dnspython>=2.6.1",
    "python-whois>=0.8.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
]

[tool.setuptools]
py-modules = ["config", "main"]

[tool.setuptools.packages.find]
include = ["modules*", "reporting*"]